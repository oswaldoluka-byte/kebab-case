<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Para Melany ♥</title>
  <meta name="description" content="Algo especial, solo para ti.">
  <meta name="theme-color" content="#f6efe6">
  <meta property="og:title" content="Para Melany ♥">
  <meta property="og:description" content="He preparado algo especial para ti.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Pinyon+Script&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="locked">
  <canvas id="petals" aria-hidden="true"></canvas>

  <!-- Portada: lo primero que ve al escanear el QR -->
  <section id="gate" class="gate">
    <div class="gate__inner">
      <svg class="gate__heart" viewBox="0 0 32 29" aria-hidden="true"><path d="M16 28.5S.5 19.3.5 9.1C.5 4.4 4.2.5 8.8.5c3 0 5.6 1.6 7.2 4.1C17.6 2.1 20.2.5 23.2.5c4.6 0 8.3 3.9 8.3 8.6 0 10.2-15.5 19.4-15.5 19.4z"/></svg>
      <p class="gate__eyebrow">Para el amor de mi vida</p>
      <button id="open-btn" class="btn">Toca aquí, <span data-her-name></span></button>
      <p class="gate__hint">sube el volumen ♪</p>
    </div>
  </section>

  <main id="story" class="story" aria-hidden="true">

    <!-- Encabezado -->
    <header class="hero reveal">
      <p class="hero__date" data-date></p>
      <h1 class="hero__title">Feliz aniversario</h1>
      <p class="hero__name" data-her-name></p>
      <div class="ornament" aria-hidden="true"><span></span>♥<span></span></div>
    </header>

    <!-- Contador de tiempo juntos (se oculta si no hay startDate) -->
    <section id="counter" class="counter reveal" hidden>
      <p class="section-label">Juntos desde hace</p>
      <div class="counter__grid">
        <div><strong data-c="days">0</strong><span>días</span></div>
        <div><strong data-c="hours">0</strong><span>horas</span></div>
        <div><strong data-c="minutes">0</strong><span>minutos</span></div>
        <div><strong data-c="seconds">0</strong><span>segundos</span></div>
      </div>
    </section>

    <!-- Galería tipo polaroid -->
    <section class="gallery reveal">
      <p class="section-label">Nuestros momentos</p>
      <div class="polaroids" id="polaroids" tabindex="0" aria-label="Fotos, desliza para ver más"></div>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <p class="gallery__hint">desliza →</p>
    </section>

    <div class="divider reveal" aria-hidden="true">
      <svg viewBox="0 0 120 20"><path d="M2 10 C 30 -4, 40 24, 60 10 S 90 -4, 118 10" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
    </div>

    <!-- Carta -->
    <section class="letter-wrap reveal">
      <p class="section-label">Una carta para ti</p>
      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Abrir la carta">
        <div class="envelope__back"></div>
        <div class="envelope__paper"></div>
        <div class="envelope__front"></div>
        <div class="envelope__flap"></div>
        <div class="seal"><span data-initial></span></div>
      </div>
      <p class="letter-wrap__hint" id="envelope-hint">toca el sello para abrirla</p>
      <article class="letter" id="letter">
        <div class="letter__body" id="letter-body"></div>
      </article>
    </section>

    <!-- Razones -->
    <section class="reasons reveal" id="reasons-section">
      <p class="section-label">Algunas razones por las que te amo</p>
      <div class="reasons__grid" id="reasons"></div>
    </section>

    <!-- Cierre -->
    <footer class="ending reveal">
      <p class="ending__line">Y si tuviera que elegir otra vez,</p>
      <p class="ending__big">te elegiría a ti</p>
      <button class="btn btn--ghost" id="love-btn">♥ Te amo</button>
      <p class="ending__sign" data-signature></p>
    </footer>
  </main>

  <button id="music-toggle" class="music" aria-label="Pausar música" hidden>
    <span></span><span></span><span></span>
  </button>
  <audio id="music" loop preload="none"></audio>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
